version: '3.8'

services:
  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: contract-intelligence-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract-intelligence-backend
    ports:
      - "8000:8000"
    environment:
      - CLOUDANT_URL=${CLOUDANT_URL}
      - CLOUDANT_API_KEY=${CLOUDANT_API_KEY}
      - CLOUDANT_DB_NAME=${CLOUDANT_DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract-intelligence-celery
    environment:
      - CLOUDANT_URL=${CLOUDANT_URL}
      - CLOUDANT_API_KEY=${CLOUDANT_API_KEY}
      - CLOUDANT_DB_NAME=${CLOUDANT_DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contract-intelligence-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  redis_data:

networks:
  default:
    name: contract-intelligence-network

